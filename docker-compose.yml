version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: lab_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: labdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./data/vgsales.csv:/data/vgsales.csv

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: lab_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: test@example.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres

  webapp:
    build: ./web-app
    container_name: lab_webapp
    restart: always
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: labdb
      DB_USER: postgres
      DB_PASSWORD: password123
    ports:
      - "5000:5000"
    depends_on:
      - postgres

volumes:
  pgdata:
